<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

<meta property="og:title" content="명인방투어 · 여행스케치" />

<link rel="stylesheet" href="./shared.css" />
<style>
  .page-head{padding:20px 18px 6px}
  .page-head h1{font-family:"Noto Serif KR",serif;font-size:24px;margin:0 0 4px}
  .page-head p{margin:0;color:var(--ink-3);font-size:13px}

  /* 4-탭 세그먼트 */
  .seg{
    margin:14px 18px;
    display:flex;background:#fff;border:1px solid var(--line);border-radius:14px;padding:4px;
    gap:3px;
  }
  .seg button{
    flex:1;background:none;border:0;padding:10px 0;
    font-size:12.5px;color:var(--ink-3);font-weight:600;
    border-radius:10px;cursor:pointer;font-family:inherit;
    display:flex;align-items:center;justify-content:center;gap:5px;white-space:nowrap;
  }
  .seg button.is-on{background:var(--ink);color:#fff8ec}
  .seg button .ct{
    background:rgba(0,0,0,.12);font-size:10px;font-weight:800;
    padding:1px 6px;border-radius:999px;
  }
  .seg button.is-on .ct{background:rgba(255,248,236,.2)}

  /* 섹션 인트로 */
  .sec-intro{
    margin:14px 18px 0;
    padding:16px 18px;
    background:linear-gradient(160deg,#fff3d6,#fde9c8);
    border:1px solid var(--line-2);border-radius:var(--radius);
  }
  .sec-intro .ico{font-size:28px;margin-bottom:4px}
  .sec-intro h2{font-family:"Noto Serif KR",serif;font-size:19px;margin:0 0 2px}
  .sec-intro p{margin:0;font-size:12.5px;color:var(--ink-2);line-height:1.55}
  .sec-intro .count{
    margin-top:8px;display:inline-block;
    background:var(--wine);color:#fff8ec;
    font-size:11px;font-weight:700;
    padding:3px 9px;border-radius:999px;
  }

  /* 리스트 카드 */
  .post-list{margin:14px 18px 0}
  .post-card{
    background:#fff;border:1px solid var(--line);border-radius:12px;
    padding:14px 16px;
    text-decoration:none;color:inherit;
    display:flex;align-items:center;gap:12px;
    position:relative;
    margin-bottom:8px;
  }
  .post-card::before{
    content:"";position:absolute;left:0;top:0;bottom:0;width:4px;
    background:var(--wine);border-radius:12px 0 0 12px;
  }
  .post-card.humanities::before{background:var(--wine)}
  .post-card.letters::before{background:var(--gold)}
  .post-card.music::before{background:var(--moss)}
  .post-card.walks::before{background:var(--sky)}
  .post-card .body{flex:1;min-width:0}
  .post-card h4{
    font-size:13.5px;margin:0;font-weight:600;line-height:1.45;
    color:var(--ink);
  }
  .post-card .meta{
    font-size:10.5px;color:var(--ink-3);margin-top:3px;
    display:flex;gap:8px;align-items:center;
  }
  .post-card .meta .num{font-weight:700}
  .post-card .arrow{color:var(--ink-3);font-size:18px;flex:0 0 16px}

  .section-bar{
    display:flex;align-items:center;justify-content:space-between;
    padding:20px 18px 8px;
  }
  .section-bar h3{font-family:"Noto Serif KR",serif;font-size:15px;margin:0;color:var(--wine)}
  .section-bar small{color:var(--ink-3);font-size:11px}

  .full-link{
    text-align:center;padding:20px 18px;
  }
  .full-link a{
    display:inline-block;background:var(--wine);color:#fff8ec;
    padding:10px 18px;border-radius:999px;
    text-decoration:none;font-size:12.5px;font-weight:700;
  }

  .loading{padding:30px 18px;text-align:center;color:var(--ink-3);font-size:13px}

  .hide{display:none !important}
</style>
</head>
<body>

<main class="stage">

  <div class="topbar">
    <span>📖</span>
    <span><b>여행스케치</b> · 능파의 큐레이션 · 길 위의 인문학 · 편지 · 음악</span>
  </div>

  <header class="header">
    <a class="brand" href="./index.html">
      <div class="brand-mark" style="font-size:12.5px;letter-spacing:-.5px">名人</div>
      <div>
        <div class="brand-name">명인방<span style="font-weight:500;font-size:13.5px;color:var(--ink-3);margin-left:2px">투어</span></div>
        <div class="brand-sub">여행스케치</div>
      </div>
    </a>
    <div class="nav-icons">
      <button aria-label="검색"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></button>
      <button aria-label="알림"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 8 3 8H3s3-1 3-8"/><path d="M10 21a2 2 0 0 0 4 0"/></svg></button>
      <button aria-label="메뉴"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg></button>
    </div>
  </header>

  <div class="page-head">
    <h1>여행스케치</h1>
    <p>길 위에서 만난 사람과 문장</p>
  </div>

  <!-- 섹션 세그먼트 -->
  <div class="seg">
    <button data-sec="humanities" class="is-on">📖 인문학 <span class="ct" id="ct-humanities">—</span></button>
    <button data-sec="letters">💌 편지 <span class="ct" id="ct-letters">—</span></button>
    <button data-sec="music">🎵 음악 <span class="ct" id="ct-music">—</span></button>
    <button data-sec="walks">🌿 산책 <span class="ct" id="ct-walks">—</span></button>
  </div>

  <!-- 섹션 인트로 (현재 섹션) -->
  <div class="sec-intro" id="sec-intro">
    <div class="ico" id="sec-icon">📖</div>
    <h2 id="sec-name">로딩 중</h2>
    <p id="sec-sub">잠시만요</p>
    <span class="count" id="sec-count"></span>
  </div>

  <!-- 리스트 -->
  <div class="section-bar">
    <h3 id="list-h">최근 글</h3>
    <small id="list-small">최신순</small>
  </div>
  <div class="post-list" id="post-list">
    <div class="loading">데이터 불러오는 중…</div>
  </div>

  <!-- 카페에서 더 보기 -->
  <div class="full-link">
    <a id="full-link" href="https://cafe.daum.net/redtraintour" target="_blank" rel="noopener">다음 카페에서 전체 보기 →</a>
  </div>

  <!-- 카톡 CTA -->
  <a class="kakao-cta" href="https://m.cafe.daum.net/redtraintour" target="_blank" rel="noopener">
    <div class="k-ico">k</div>
    <div>
      <b>새 글이 올라오면 카톡으로 받기</b>
      <span>주간 다이제스트 · 매주 월 21시</span>
    </div>
    <div style="margin-left:auto;font-size:18px">›</div>
  </a>

  <footer>
    <div class="brand-name">명인방투어 · 능파</div>
    <div>여행스케치 원본은 다음 카페에서 → <a href="https://cafe.daum.net/redtraintour" target="_blank">cafe.daum.net/redtraintour</a></div>
    <div style="margin-top:14px;color:var(--ink-3)">© 2026 명인방투어 v0.6</div>
  </footer>

  <nav class="tabbar">
    <a href="./index.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12 12 4l9 8"/><path d="M5 10v10h14V10"/></svg>홈</a>
    <a href="./tour.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 17V6h16v11"/><circle cx="7" cy="18" r="2"/><circle cx="17" cy="18" r="2"/><path d="M4 11h16"/></svg>여행</a>
    <a class="is-on" href="./story.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16v14H4z"/><path d="M4 9h16"/><path d="M9 13h7"/></svg>여행스케치</a>
    <a href="./place.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s7-7 7-12a7 7 0 1 0-14 0c0 5 7 12 7 12Z"/><circle cx="12" cy="10" r="2.5"/></svg>명인소</a>
    <a href="./my.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-7 8-7s8 3 8 7"/></svg>마이</a>
  </nav>
</main>

<a class="fab" href="https://m.cafe.daum.net/redtraintour" target="_blank" rel="noopener" aria-label="다음 카페 바로가기">TALK</a>

<script>
  let SECTIONS = null;
  let currentSec = 'humanities';

  async function loadStories() {
    try {
      const res = await fetch('./data/stories.json');
      const json = await res.json();
      SECTIONS = json.sections;
      // 카운트 갱신
      Object.keys(SECTIONS).forEach(key => {
        const el = document.getElementById('ct-' + key);
        if (el) el.textContent = SECTIONS[key].posts.length;
      });
      renderSection(currentSec);
    } catch (e) {
      document.getElementById('post-list').innerHTML =
        '<div class="loading">데이터 로딩 실패 (file://에서는 fetch 차단됩니다 — Netlify 배포에서 정상 작동)</div>';
    }
  }

  function renderSection(key) {
    if (!SECTIONS || !SECTIONS[key]) return;
    currentSec = key;
    const sec = SECTIONS[key];
    // 인트로
    document.getElementById('sec-icon').textContent = sec.icon;
    document.getElementById('sec-name').textContent = sec.name;
    document.getElementById('sec-sub').textContent = sec.subtitle;
    document.getElementById('sec-count').textContent = sec.posts.length + '편 수집';
    document.getElementById('list-h').textContent = '최근 ' + sec.name;
    document.getElementById('list-small').textContent = sec.posts.length + '편';
    document.getElementById('full-link').href = sec.cafeUrl;

    // 리스트
    const list = document.getElementById('post-list');
    if (sec.posts.length === 0) {
      list.innerHTML = '<div class="loading">아직 글이 없습니다</div>';
      return;
    }
    // 최근 시간순 정렬 — 작성일(posted) 우선, 없으면 pid(카페 글번호는 시간순 증가) 내림차순
    const posts = [...sec.posts].sort((a, b) => {
      const da = a.posted || '', db = b.posted || '';
      if (da && db && da !== db) return db.localeCompare(da);
      return (parseInt(b.pid) || 0) - (parseInt(a.pid) || 0);
    });
    list.innerHTML = posts.map((p, idx) => `
      <a class="post-card ${key}" href="https://cafe.daum.net/redtraintour/${sec.bid}/${p.pid}" target="_blank" rel="noopener">
        <div class="body">
          <h4>${p.title}</h4>
          <div class="meta">
            <span class="num">No.${p.pid}</span>
            <span>${sec.name}</span>
          </div>
        </div>
        <span class="arrow">›</span>
      </a>
    `).join('');
  }

  // 탭 클릭
  document.querySelectorAll('.seg button').forEach(b => {
    b.addEventListener('click', () => {
      document.querySelectorAll('.seg button').forEach(x => x.classList.remove('is-on'));
      b.classList.add('is-on');
      renderSection(b.dataset.sec);
    });
  });

  // URL hash로 초기 섹션
  const hashSec = (location.hash || '').replace('#', '');
  if (['humanities','letters','music','walks'].includes(hashSec)) {
    currentSec = hashSec;
    document.querySelectorAll('.seg button').forEach(x => x.classList.toggle('is-on', x.dataset.sec === hashSec));
  }

  loadStories();
</script>

<script src="./pwa.js"></script>
</body>
</html>
