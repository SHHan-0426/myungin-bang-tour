<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>명인방투어 · 명인소</title>
<meta name="description" content="능파가 손꼽은 사람과 장소 — 명인 추천, 명품 맛집, 칼국수로드." />
<meta name="theme-color" content="#7a1b25" />
<link rel="manifest" href="./manifest.webmanifest" />
<link rel="apple-touch-icon" href="./assets/icon-192.png?v2" />
<link rel="icon" type="image/svg+xml" href="./assets/icon.svg?v2" />
<meta property="og:type" content="website" />
<meta property="og:site_name" content="명인방투어" />
<meta property="og:title" content="명인방투어 · 명인소" />
<meta property="og:description" content="사람 한 명을 보러 가는 여행." />
<meta property="og:image" content="https://myungin-bang-tour.netlify.app/assets/place-01.jpg" />
<meta property="og:url" content="https://myungin-bang-tour.netlify.app/place.html" />
<meta property="og:locale" content="ko_KR" />
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
<link rel="stylesheet" href="./shared.css" />
<style>
  .page-head{padding:20px 18px 6px}
  .page-head h1{font-family:"Noto Serif KR",serif;font-size:24px;margin:0 0 4px}
  .page-head p{margin:0;color:var(--ink-3);font-size:13px}

  .seg{
    margin:14px 18px;
    display:flex;background:#fff;border:1px solid var(--line);border-radius:14px;padding:5px;
    gap:3px;
  }
  .seg button{
    flex:1;background:none;border:0;padding:11px 0;
    font-size:13px;color:var(--ink-3);font-weight:600;
    border-radius:10px;cursor:pointer;font-family:inherit;
    display:flex;align-items:center;justify-content:center;gap:5px;white-space:nowrap;
  }
  .seg button.is-on{background:var(--ink);color:#fff8ec}
  .seg button .ct{
    background:rgba(0,0,0,.12);font-size:10px;font-weight:800;
    padding:1px 6px;border-radius:999px;
  }
  .seg button.is-on .ct{background:rgba(255,248,236,.2)}

  .sec-intro{
    margin:14px 18px 0;
    padding:16px 18px;
    background:linear-gradient(160deg,#fff3d6,#fde9c8);
    border:1px solid var(--line-2);border-radius:var(--radius);
  }
  .sec-intro .ico{font-size:28px;margin-bottom:4px}
  .sec-intro h2{font-family:"Noto Serif KR",serif;font-size:19px;margin:0 0 2px}
  .sec-intro p{margin:0;font-size:12.5px;color:var(--ink-2);line-height:1.55}

  /* 태그 필터 */
  .tag-chips{
    display:flex;gap:6px;overflow-x:auto;padding:12px 18px 0;
    scrollbar-width:none;
  }
  .tag-chips::-webkit-scrollbar{display:none}
  .tag-chips .tc{
    flex:0 0 auto;
    padding:6px 12px;border-radius:999px;
    background:#fff;border:1px solid var(--line-2);
    font-size:12px;color:var(--ink-2);
    white-space:nowrap;cursor:pointer;font-weight:500;
  }
  .tag-chips .tc.is-on{background:var(--wine);color:#fff8ec;border-color:var(--wine)}
  .tag-chips .tc .ct{font-size:10px;opacity:.7;margin-left:3px}

  .section-bar{
    display:flex;align-items:center;justify-content:space-between;
    padding:18px 18px 8px;
  }
  .section-bar h3{font-family:"Noto Serif KR",serif;font-size:15px;margin:0;color:var(--wine)}
  .section-bar small{color:var(--ink-3);font-size:11px}

  /* 명인소 카드 (리스트) */
  .place-list{margin:0 18px}
  .place-card{
    background:#fff;border:1px solid var(--line);border-radius:12px;
    padding:14px 16px;
    text-decoration:none;color:inherit;
    display:flex;align-items:center;gap:12px;
    position:relative;
    margin-bottom:8px;
  }
  .place-card::before{
    content:"";position:absolute;left:0;top:0;bottom:0;width:5px;
    background:var(--moss);border-radius:12px 0 0 12px;
  }
  .place-card.t-음식::before{background:#d97b3a}
  .place-card.t-공간::before{background:#5b6b3a}
  .place-card.t-자연::before{background:#5b6b3a}
  .place-card.t-예술::before{background:var(--wine)}
  .place-card.t-여행::before{background:var(--sky)}
  .place-card.t-카페::before{background:#8a5d3b}
  .place-card.t-국내::before{background:var(--moss)}
  .place-card.t-해외::before{background:var(--wine)}

  .place-card .body{flex:1;min-width:0}
  .place-card h4{
    font-size:14px;margin:0;font-weight:600;line-height:1.4;
  }
  .place-card .meta{
    font-size:10.5px;color:var(--ink-3);margin-top:4px;
    display:flex;gap:6px;align-items:center;
  }
  .place-card .tagchip{
    background:var(--tag-bg);color:var(--tag-ink);
    font-size:10px;font-weight:700;padding:2px 7px;border-radius:999px;
  }
  .place-card .num{color:var(--ink-3);font-size:10.5px;font-weight:600}
  .place-card .arrow{color:var(--ink-3);font-size:18px;flex:0 0 16px}

  .full-link{
    text-align:center;padding:20px 18px;
  }
  .full-link a{
    display:inline-block;background:var(--wine);color:#fff8ec;
    padding:10px 18px;border-radius:999px;
    text-decoration:none;font-size:12.5px;font-weight:700;
  }

  /* 시리즈 배너 (칼국수로드) */
  .series-banner{
    margin:14px 18px;
    background:linear-gradient(160deg,#fff3d6,#fde2c1);
    border:1px solid var(--line-2);border-radius:var(--radius);
    padding:18px;
    text-decoration:none;color:inherit;display:block;
  }
  .series-banner .kicker{font-size:11px;letter-spacing:.15em;color:var(--wine);font-weight:700}
  .series-banner h3{font-family:"Noto Serif KR",serif;font-size:18px;margin:4px 0 4px;color:var(--ink)}
  .series-banner p{margin:0;font-size:12.5px;color:var(--ink-2);line-height:1.55}

  .loading{padding:30px 18px;text-align:center;color:var(--ink-3);font-size:13px}
</style>
</head>
<body>

<main class="stage">

  <div class="topbar">
    <span>📍</span>
    <span><b>명인소</b> · 능파가 손꼽은 사람과 장소</span>
  </div>

  <header class="header">
    <a class="brand" href="./index.html">
      <div class="brand-mark" style="font-size:12.5px;letter-spacing:-.5px">名人</div>
      <div>
        <div class="brand-name">명인방<span style="font-weight:500;font-size:13.5px;color:var(--ink-3);margin-left:2px">투어</span></div>
        <div class="brand-sub">명인소</div>
      </div>
    </a>
    <div class="nav-icons">
      <button aria-label="검색"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></button>
      <button aria-label="알림"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 8 3 8H3s3-1 3-8"/><path d="M10 21a2 2 0 0 0 4 0"/></svg></button>
      <button aria-label="메뉴"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg></button>
    </div>
  </header>

  <div class="page-head">
    <h1>명인소</h1>
    <p>사람 한 명을 보러 가는 여행</p>
  </div>

  <!-- 섹션 세그먼트 -->
  <div class="seg">
    <button data-sec="recommended" class="is-on">📍 명인 추천 <span class="ct" id="ct-recommended">—</span></button>
    <button data-sec="restaurants">🍽 명품 맛집 <span class="ct" id="ct-restaurants">—</span></button>
    <button data-sec="kalguksu">🍜 칼국수로드 <span class="ct" id="ct-kalguksu">—</span></button>
  </div>

  <!-- 섹션 인트로 -->
  <div class="sec-intro">
    <div class="ico" id="sec-icon">📍</div>
    <h2 id="sec-name">로딩 중</h2>
    <p id="sec-sub"></p>
  </div>

  <!-- 태그 칩 -->
  <div class="tag-chips" id="tag-chips"></div>

  <!-- 리스트 -->
  <div class="section-bar">
    <h3 id="list-h">전체</h3>
    <small id="list-small">— 곳</small>
  </div>
  <div class="place-list" id="place-list">
    <div class="loading">데이터 불러오는 중…</div>
  </div>

  <div class="full-link">
    <a id="full-link" href="https://cafe.daum.net/redtraintour" target="_blank" rel="noopener">다음 카페에서 전체 보기 →</a>
  </div>

  <!-- 카톡 CTA -->
  <a class="kakao-cta" href="https://m.cafe.daum.net/redtraintour" target="_blank" rel="noopener">
    <div class="k-ico">k</div>
    <div>
      <b>나만의 명인소 추천하기</b>
      <span>카톡으로 사진과 사연 보내주시면 큐레이션 검토</span>
    </div>
    <div style="margin-left:auto;font-size:18px">›</div>
  </a>

  <footer>
    <div class="brand-name">명인방투어 · 능파</div>
    <div>모든 명인소는 다음 카페에서 → <a href="https://cafe.daum.net/redtraintour" target="_blank">전체보기</a></div>
    <div style="margin-top:14px;color:var(--ink-3)">© 2026 명인방투어 v0.6</div>
  </footer>

  <nav class="tabbar">
    <a href="./index.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12 12 4l9 8"/><path d="M5 10v10h14V10"/></svg>홈</a>
    <a href="./tour.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 17V6h16v11"/><circle cx="7" cy="18" r="2"/><circle cx="17" cy="18" r="2"/><path d="M4 11h16"/></svg>여행</a>
    <a href="./story.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16v14H4z"/><path d="M4 9h16"/><path d="M9 13h7"/></svg>여행스케치</a>
    <a class="is-on" href="./place.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s7-7 7-12a7 7 0 1 0-14 0c0 5 7 12 7 12Z"/><circle cx="12" cy="10" r="2.5"/></svg>명인소</a>
    <a href="./my.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-7 8-7s8 3 8 7"/></svg>마이</a>
  </nav>
</main>

<a class="fab" href="https://m.cafe.daum.net/redtraintour" target="_blank" rel="noopener" aria-label="다음 카페 바로가기">TALK</a>

<script>
  let SECTIONS = null;
  let currentSec = 'recommended';
  let currentTag = 'all';

  async function loadPlaces() {
    try {
      const res = await fetch('./data/places.json');
      const json = await res.json();
      SECTIONS = json.sections;
      Object.keys(SECTIONS).forEach(key => {
        const el = document.getElementById('ct-' + key);
        if (el) el.textContent = SECTIONS[key].posts.length;
      });
      renderSection(currentSec);
    } catch (e) {
      document.getElementById('place-list').innerHTML =
        '<div class="loading">데이터 로딩 실패 (file://에서는 fetch 차단됩니다)</div>';
    }
  }

  function renderSection(key) {
    if (!SECTIONS || !SECTIONS[key]) return;
    currentSec = key;
    currentTag = 'all';
    const sec = SECTIONS[key];
    document.getElementById('sec-icon').textContent = sec.icon;
    document.getElementById('sec-name').textContent = sec.name;
    document.getElementById('sec-sub').textContent = sec.subtitle;
    document.getElementById('full-link').href = sec.cafeUrl;

    // 태그 칩 생성
    const tags = [...new Set(sec.posts.map(p => p.tag).filter(Boolean))];
    const tagCounts = {};
    sec.posts.forEach(p => { if (p.tag) tagCounts[p.tag] = (tagCounts[p.tag]||0)+1 });
    const chipsEl = document.getElementById('tag-chips');
    if (tags.length === 0) {
      chipsEl.style.display = 'none';
    } else {
      chipsEl.style.display = 'flex';
      chipsEl.innerHTML = [
        `<span class="tc is-on" data-tag="all">전체 <span class="ct">${sec.posts.length}</span></span>`,
        ...tags.map(t => `<span class="tc" data-tag="${t}">${t} <span class="ct">${tagCounts[t]}</span></span>`)
      ].join('');
      chipsEl.querySelectorAll('.tc').forEach(c => {
        c.addEventListener('click', () => {
          chipsEl.querySelectorAll('.tc').forEach(x => x.classList.remove('is-on'));
          c.classList.add('is-on');
          currentTag = c.dataset.tag;
          renderList();
        });
      });
    }
    renderList();
  }

  function renderList() {
    const sec = SECTIONS[currentSec];
    let posts = sec.posts;
    if (currentTag !== 'all') posts = posts.filter(p => p.tag === currentTag);
    document.getElementById('list-h').textContent = currentTag === 'all' ? sec.name : sec.name + ' · ' + currentTag;
    document.getElementById('list-small').textContent = posts.length + '곳';

    const list = document.getElementById('place-list');
    if (posts.length === 0) {
      list.innerHTML = '<div class="loading">해당 분류의 명인소가 없습니다</div>';
      return;
    }
    list.innerHTML = posts.map(p => `
      <a class="place-card t-${p.tag||''}" href="https://cafe.daum.net/redtraintour/${sec.bid}/${p.pid}" target="_blank" rel="noopener">
        <div class="body">
          <h4>${p.title}</h4>
          <div class="meta">
            ${p.tag ? `<span class="tagchip">${p.tag}</span>` : ''}
            <span class="num">No.${p.pid}</span>
          </div>
        </div>
        <span class="arrow">›</span>
      </a>
    `).join('');
  }

  document.querySelectorAll('.seg button').forEach(b => {
    b.addEventListener('click', () => {
      document.querySelectorAll('.seg button').forEach(x => x.classList.remove('is-on'));
      b.classList.add('is-on');
      renderSection(b.dataset.sec);
    });
  });

  loadPlaces();
</script>

<script src="./pwa.js"></script>
</body>
</html>
